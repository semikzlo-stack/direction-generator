<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Post generator</title>
  <link rel="stylesheet" href="app/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand-name" id="brandName">Post generator</div>
    <div class="spacer"></div>
    <button class="btn ghost" id="newBtn" data-i18n="newPost">New post</button>
    <button class="btn" id="downloadSlideBtn" data-i18n="downloadSlide">Download slide</button>
    <button class="btn primary" id="downloadAllBtn" data-i18n="downloadAll">Download all</button>
    <div class="lang" id="lang"><button data-lang="pl">PL</button><button data-lang="en">EN</button></div>
  </header>

  <aside class="panel" id="panel">
    <!-- Post -->
    <section class="group">
      <div class="seg" id="formatSeg">
        <button data-format="instagram" class="active">Instagram</button>
        <button data-format="linkedin">LinkedIn</button>
      </div>
      <div class="color-row">
        <span class="color-label" data-i18n="lineColor">Line</span>
        <div class="colors" id="lineColors"></div>
      </div>
      <div class="color-row">
        <span class="color-label" data-i18n="bgColor">Background</span>
        <div class="colors" id="bgColors"></div>
      </div>
    </section>

    <!-- Slide -->
    <section class="group">
      <div class="slide-head">
        <span id="slideTitle">1 / 3</span>
        <div class="slide-actions">
          <button class="icon" id="moveLeftBtn" aria-label="Move left">←</button>
          <button class="icon" id="moveRightBtn" aria-label="Move right">→</button>
          <button class="icon danger" id="deleteBtn" aria-label="Delete">✕</button>
        </div>
      </div>

      <div class="seg seg-block" id="typeSeg"></div>
      <p class="note" id="coverPartNote" data-i18n="coverPartNote" hidden>Second half of the cover.</p>

      <div class="text-field" id="textField">
        <div class="text-tools">
          <button class="icon italic" id="italicBtn" aria-label="Italic" aria-pressed="false"><i>I</i></button>
          <span class="counter" id="lineCounter"></span>
        </div>
        <div class="text-input empty" id="textInput" role="textbox" aria-multiline="true" lang="pl"></div>
      </div>

      <div class="photo-field" id="photoField">
        <button class="btn block" id="uploadBtn" data-i18n="choosePhoto">Choose photo</button>
        <div class="zoom-row">
          <span aria-hidden="true">−</span>
          <input type="range" id="zoomSlider" min="0" max="100" value="0" aria-label="Zoom">
          <span aria-hidden="true">+</span>
          <button class="icon" id="resetPhotoBtn" aria-label="Reset framing">↺</button>
        </div>
        <label class="check" id="continueRow">
          <input type="checkbox" id="continueToggle">
          <span data-i18n="continuePhoto">Continue the previous photo</span>
        </label>
        <p class="note" id="spanHint"></p>
        <input type="file" id="fileInput" accept="image/*" hidden>
      </div>

      <div class="warnings" id="warnings"></div>
    </section>
  </aside>

  <main class="stage">
    <div class="canvas-wrap" id="canvasWrap">
      <canvas id="preview"></canvas>
      <canvas id="overlay"></canvas>
    </div>
    <button class="guides-toggle active" id="guidesToggle" aria-pressed="true" data-i18n="guides">Safe zone</button>
  </main>

  <aside class="drafts" id="draftsCol">
    <button class="btn block" id="saveDraftBtn" data-i18n="saveDraft">Save draft</button>
    <div class="drafts-list" id="draftsList"></div>
  </aside>

  <footer class="strip-wrap">
    <div class="strip" id="strip"></div>
    <div class="add-wrap">
      <button class="btn add" id="addBtn" aria-label="Add slide">+</button>
      <div class="add-menu" id="addMenu"></div>
    </div>
  </footer>

  <div class="toast" id="toast" hidden></div>
  <script type="module" src="app/app.js"></script>
</body>
</html>
